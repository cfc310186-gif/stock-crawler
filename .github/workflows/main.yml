name: Daily Stock Crawler & Notify

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target trading date, YYYY-MM-DD. Leave empty to auto-detect.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_DATE: ${{ github.event.inputs.target_date || '' }}

    steps:
    - name: Print dispatch diagnostics
      run: |
        echo "event_name=${{ github.event_name }}"
        echo "target_date=${TARGET_DATE:-auto}"
        echo "run_started_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        TZ=Asia/Taipei date '+run_started_taipei=%Y-%m-%dT%H:%M:%S%z'

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt

    - name: Smoke test (parser fixtures)
      run: pytest tests/test_parsers.py -q

    - name: Create Key File
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > service_account.json

    - name: Run Crawler (爬蟲)
      run: |
        python main.py

    - name: Run Notification (發送 LINE)
      env:
        # 這裡將 GitHub Secrets 注入到環境變數，讓 python 讀取
        LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      run: |
        python notify.py
